name: qayd
description: "AI-Powered Lecture Summarizer"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Audio & Files
  record: ^7.1.1
  just_audio: ^0.9.42
  file_picker: ^13.3.2
  path_provider: ^2.1.5

  # Network & API
  dio: ^5.7.0

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities & Design
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  intl: ^0.20.3
  ffmpeg_kit_flutter_new_audio: ^2.5.8
  pdf: ^3.13.1
  printing: ^5.15.1
  bidi: ^2.0.13
  camera: ^0.12.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/image.png"
  adaptive_icon_background: "#F4F7FC"
  adaptive_icon_foreground: "assets/icon/foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/foreground.png

